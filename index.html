<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Trading Scanner Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #0b1220;
      color: white;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: #111a2e;
      padding: 15px;
      border-radius: 14px;
      margin-top: 15px;
      position: relative;
      overflow: hidden;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      color: white;
      font-size: 16px;
    }

    input {
      width: 100%;
      margin-top: 10px;
    }

    /* 🔥 SCANNER ANIMATION */
    .scanner-line {
      position: absolute;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #22c55e, transparent);
      top: 0;
      left: 0;
      animation: scan 2s linear infinite;
      display: none;
    }

    @keyframes scan {
      0% { top: 0%; opacity: 0.2; }
      50% { opacity: 1; }
      100% { top: 100%; opacity: 0.2; }
    }

    .signal {
      font-size: 34px;
      text-align: center;
      font-weight: bold;
      margin-top: 15px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .buy { color: #22c55e; }
    .sell { color: #ef4444; }
    .wait { color: #eab308; }

    .row {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
    }

    .label { opacity: 0.7; }

    .box {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.9;
    }

    .strategy {
      margin-top: 10px;
      padding: 10px;
      background: #0f172a;
      border-radius: 10px;
      font-size: 13px;
    }

    .tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      margin: 3px;
      font-size: 12px;
      background: #1e293b;
    }

    .green { background: #14532d; }
    .red { background: #7f1d1d; }

    .loading {
      text-align: center;
      margin-top: 10px;
      color: #60a5fa;
      display: none;
    }
  </style>
</head>

<body>

<h1>📡 AI Market Scanner</h1>

<div class="card">
  <div class="scanner-line" id="scanner"></div>

  <input type="file" id="fileInput" />
  <button onclick="analyze()">Scan Market</button>

  <div class="loading" id="loading">Scanning market structure...</div>
</div>

<div class="card">

  <div class="signal" id="signal">WAIT</div>

  <div class="box">
    Score: <span id="score">-</span><br>
    Expiry: <span id="expiry">-</span><br>
    Accuracy: <span id="accuracy">-</span>
  </div>

  <div class="strategy">
    <b>Multi-Strategy Engine:</b><br>
    <div id="strategies"></div>
  </div>

</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  function getExpiry(score) {
    if (score >= 85) return "5 min";
    if (score >= 70) return "10 min";
    if (score >= 60) return "15 min";
    return "NO TRADE";
  }

  function showScanner() {
    document.getElementById("scanner").style.display = "block";
  }

  function hideScanner() {
    document.getElementById("scanner").style.display = "none";
  }

  async function analyze() {
    const file = document.getElementById("fileInput").files[0];

    if (!file) {
      alert("Upload screenshot");
      return;
    }

    showScanner();
    document.getElementById("loading").style.display = "block";

    const formData = new FormData();
    formData.append("file", file);

    try {
      const res = await fetch("http://localhost:8000/analyze/", {
        method: "POST",
        body: formData
      });

      const data = await res.json();

      hideScanner();
      document.getElementById("loading").style.display = "none";

      // SIGNAL
      document.getElementById("signal").innerText = data.signal;

      // SCORE
      document.getElementById("score").innerText = data.score  0;

      // EXPIRY
      document.getElementById("expiry").innerText =
        getExpiry(data.score  0);

      // ACCURACY
      document.getElementById("accuracy").innerText =
        (data.accuracy  0) + "%";

      // MULTI STRATEGY DISPLAY
      const el = document.getElementById("strategies");
      el.innerHTML = "";

      const strategies = data.strategies  {
        supertrend: false,
        ema200: false,
        rsi: false,
        macd: false,
        volume: false
      };

      for (let key in strategies) {
        const ok = strategies[key];

        const tag = document.createElement("div");
        tag.className = "tag " + (ok ? "green" : "red");
        tag.innerText = (ok ? "✔️ " : "✖️ ") + key.toUpperCase();

        el.appendChild(tag);
      }

    } catch (err) {
      console.error(err);
      alert("Backend error");
      hideScanner();
      document.getElementById("loading").style.display = "none";
    }
  }
</script>

</body>
</html>
