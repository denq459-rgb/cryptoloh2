<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kryon AI Trade Bot - Ultra Vision Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0c0f17;
            --card-bg: #161a24;
            --accent: #00f281;
            --accent-blue: #00d4ff;
            --text-main: #ffffff;
            --text-gray: #7a828a;
            --border: #232a35;
            --danger: #ff4b5c;
            --warning: #ff9d00;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            padding: 25px 15px 15px;
            text-align: center;
            background: linear-gradient(to bottom, #11151e, var(--bg-color));
            border-bottom: 1px solid var(--border);
        }

        .header-logo {
            width: 44px; height: 44px;
            background: var(--card-bg);
            border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            border: 2px solid var(--accent);
            margin-bottom: 10px; color: var(--accent); font-size: 24px;
            box-shadow: 0 0 20px rgba(0, 242, 129, 0.2);
        }

        .app-title { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: 0.5px; }
        
        .steps-bar {
            display: inline-flex; gap: 20px;
            background: #11151e; padding: 8px 20px;
            border-radius: 20px; font-size: 11px; color: var(--text-gray);
            margin-top: 15px; border: 1px solid #1a1f29;
        }
        .steps-bar span.active { color: var(--text-main); display: flex; align-items: center; gap: 6px; }
        .steps-bar span.active::before { content: '●'; color: var(--accent); }

        .content { flex: 1; padding: 20px 15px 120px; }
        
        .screen { display: none; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 24px;
            padding: 20px 15px;  /* уменьшен верхний отступ, чтобы канвас влезал */
            text-align: center;
            background: rgba(255,255,255,0.02);
            position: relative;
            cursor: pointer;
            overflow: hidden;     /* чтобы канвас не вылезал */
        }

        #main-canvas { 
            display: none; 
            max-width: 100%;      /* не растягиваться шире контейнера */
            height: auto; 
            margin: 10px auto 0;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .scan-line { position: absolute; left: 0; width: 100%; height: 2px; background: var(--accent); box-shadow: 0 0 15px var(--accent); display: none; z-index: 10; pointer-events: none; }
        .analysis-log { position: absolute; top: 10px; left: 10px; font-family: monospace; font-size: 10px; color: var(--accent); background: rgba(0,0,0,0.7); padding: 8px; border-radius: 6px; display: none; z-index: 11; max-width: 80%; }

        .result-card { 
            background: var(--card-bg); border-radius: 28px; padding: 30px 20px; text-align: center; border: 2px solid var(--border); margin-bottom: 20px;
        }
        .signal-val { font-size: 52px; font-weight: 900; margin: 10px 0; }
        
        .indicator-panel {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;
        }
        .ind-item {
            background: #11151e; padding: 12px; border-radius: 12px; text-align: left; border: 1px solid var(--border);
        }
        .ind-label { font-size: 10px; color: var(--text-gray); text-transform: uppercase; margin-bottom: 4px; }
        .ind-value { font-size: 12px; font-weight: 700; color: #fff; }
        .ind-value.pos { color: var(--accent); }
        .ind-value.neg { color: var(--danger); }

        .btn-main {
            width: 100%; padding: 22px; background: var(--accent); color: #000; border: none; border-radius: 18px; font-weight: 800; font-size: 16px; cursor: pointer; text-transform: uppercase; margin-bottom: 15px;
        }
        .btn-main:disabled { background: #232a35; color: #555; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #11151e; border-top: 1px solid var(--border); padding: 15px 0 35px; text-align: center; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-logo">🤖</div>
        <h1 class="app-title">Kryon AI Vision</h1>
        <div class="steps-bar">
            <span id="step-upload" class="active">SCAN</span>
            <span id="step-result">RESULT</span>
        </div>
    </div>

    <div class="content">
        <div id="screen-upload" class="screen active">
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div id="placeholder">
                    <div style="font-size: 50px; margin-bottom: 15px;">📊</div>
                    <div style="font-weight: 800;">UPLOAD CHART</div>
                    <div style="font-size: 11px; color: var(--text-gray); margin-top: 8px;">AI Detects Levels, Patterns & Volumes</div>
                </div>
                <div class="analysis-log" id="analysisLog"></div>
                <div class="scan-line" id="scanLine"></div>
                <canvas id="main-canvas"></canvas>
            </div>

            <div style="margin-top: 15px; text-align: center; font-size: 12px; color: var(--text-gray);">
                Chart Color: 
                <select id="colorTheme" style="background:#161a24; color:#fff; border:1px solid #232a35; border-radius:5px; padding:3px;">
                    <option value="green_red">Green / Red</option>
                    <option value="blue_red">Blue / Red</option>
                </select>
            </div>

            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(this)">
            <button id="visionBtn" class="btn-main" style="display:none; margin-top: 25px;" onclick="performDeepAnalysis()">START AI SCAN</button>
        </div>

        <div id="screen-result" class="screen">
            <div class="result-card" id="resBorder">
                <div style="color: var(--text-gray); font-size: 11px; letter-spacing: 1px;">AI PROBABILITY SIGNAL</div>
                <div id="resSignal" class="signal-val">---</div>
                <div id="resAccuracy" style="font-size: 18px; font-weight: bold; color: var(--accent-blue);">Confidence: --%</div>
                
                <div class="indicator-panel">
                    <div class="ind-item">
                        <div class="ind-label">Pattern</div>
                        <div id="resPattern" class="ind-value">None Detected</div>
                    </div>
                    <div class="ind-item">
                        <div class="ind-label">Market Phase</div>
                        <div id="resPhase" class="ind-value">Scanning...</div>
                    </div>
                    <div class="ind-item">
                        <div class="ind-label">Volume Level</div>
                        <div id="resVolume" class="ind-value">Normal</div>
                    </div>
                    <div class="ind-item">
                        <div class="ind-label">Key Level</div>
                        <div id="resLevel" class="ind-value">No Zones</div>
                    </div>
                </div>
            </div>
            <button class="btn-main" style="background: #232a35; color: #fff;" onclick="location.reload()">NEW ANALYSIS</button>
        </div>
    </div>

    <div class="nav-bar"><div style="color:var(--accent); font-size:10px; font-weight:bold;">⚡ ADVANCED ENGINE v5.0 ACTIVE</div></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // --- Адаптивная ширина канваса под контейнер ---
        function getContainerWidth() {
            const uploadArea = document.querySelector('.upload-area');
            // ширина минус внутренние отступы и border (примерно)
            const style = window.getComputedStyle(uploadArea);
            const paddingLeft = parseFloat(style.paddingLeft);
            const paddingRight = parseFloat(style.paddingRight);
            const borderLeft = parseFloat(style.borderLeftWidth);
            const borderRight = parseFloat(style.borderRightWidth);
            return uploadArea.clientWidth - paddingLeft - paddingRight - borderLeft - borderRight - 20; // еще небольшой запас
        }

        function handleImage(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const maxWidth = getContainerWidth();
                    const aspect = img.height / img.width;
                    // Устанавливаем внутренний размер канваса равным доступной ширине
                    canvas.width = maxWidth;
                    canvas.height = maxWidth * aspect;
                    ctx.clearRect(0, 0, canvas.width, canvas.height); // на всякий случай
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.style.display = 'block';
                    document.getElementById('placeholder').style.display = 'none';
                    document.getElementById('visionBtn').style.display = 'block';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- Оптимизированный анализ с однократным чтением пикселей ---
        async function performDeepAnalysis() {
            const btn = document.getElementById('visionBtn');
            const line = document.getElementById('scanLine');
            const log = document.getElementById('analysisLog');
            const theme = document.getElementById('colorTheme').value;
            
            btn.disabled = true;
            line.style.display = 'block';
            log.style.display = 'block';
            log.innerHTML = "";

            const logs = [
                "> Pre-processing image pixels...",
                "> Mapping Support & Resistance zones...",
                "> Scanning geometric chart patterns...",
                "> Analyzing volume bar intensity...",
                "> Calculating momentum volatility...",
                "> Generating final signal..."
            ];

            for (let i = 0; i < logs.length; i++) {
                log.innerHTML += logs[i] + "<br>";
                line.style.top = (i * 18) + "%";
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                await new Promise(r => setTimeout(r, 600));
            }

            const w = canvas.width;
            const h = canvas.height;
            // Единственный вызов getImageData на всё изображение
            const fullImageData = ctx.getImageData(0, 0, w, h);
            const imgData = fullImageData.data;

            // --- 1. СБОР СВЕЧЕЙ (RECONSTRUCTION) ---
            const candles = [];
            for (let x = 0; x < w; x += 10) {
                let top = h, bottom = 0, g = 0, r = 0;
                for (let y = 0; y < h; y++) {
                    const idx = (y * w + x) * 4;
                    const rP = imgData[idx], gP = imgData[idx+1], bP = imgData[idx+2];
                    let isCandlePixel = false;
                    if (theme === 'green_red') {
                        if (gP > rP + 30) { g++; isCandlePixel = true; }
                        else if (rP > gP + 30) { r++; isCandlePixel = true; }
                    } else {
                        if (bP > rP + 30) { g++; isCandlePixel = true; }
                        else if (rP > bP + 30) { r++; isCandlePixel = true; }
                    }
                    if (isCandlePixel) {
                        top = Math.min(top, y);
                        bottom = Math.max(bottom, y);
                    }
                }
                if (g + r > 5) {
                    candles.push({ x, top, bottom, isUp: g > r, size: bottom - top });
                }
            }

            // --- 2. УРОВНИ (исправлено приведение типов) ---
            const levelClusters = {};
            candles.forEach(c => {
                const tL = Math.round(c.top / 20) * 20;
                const bL = Math.round(c.bottom / 20) * 20;
                levelClusters[tL] = (levelClusters[tL] || 0) + 1;
                levelClusters[bL] = (levelClusters[bL] || 0) + 1;
            });
            const strongLevels = Object.keys(levelClusters)
                .filter(k => levelClusters[k] > 3)
                .map(Number); // обязательно число
            const lastCandle = candles[candles.length - 1];
            const nearLevel = strongLevels.find(l => Math.abs(l - lastCandle.top) < 30 || Math.abs(l - lastCandle.bottom) < 30);

            // --- 3. ФИГУРЫ (исправлен поиск Double Top/Bottom) ---
            let detectedPattern = "Classic Price Action";
            const lastN = candles.slice(-20);
            if (lastN.length >= 10) {
                const tops = lastN.map(c => c.top);
                const bottoms = lastN.map(c => c.bottom);
                
                // Поиск Double Top: два пика примерно на одном уровне с провалом между ними
                const maxTop = Math.max(...tops);
                const minTop = Math.min(...tops);
                // Ищем два локальных максимума, близких к глобальному максимуму
                let peaks = [];
                for (let i = 1; i < tops.length - 1; i++) {
                    if (tops[i] > tops[i-1] && tops[i] > tops[i+1]) peaks.push(i);
                }
                // Оставляем те, что находятся в пределах 2% от maxTop
                peaks = peaks.filter(i => tops[i] >= maxTop * 0.98);
                if (peaks.length >= 2) {
                    // Проверяем, что между ними есть более низкая точка (провал)
                    const first = peaks[0], second = peaks[peaks.length-1];
                    const between = tops.slice(first, second+1);
                    if (Math.min(...between) < maxTop * 0.95) {
                        detectedPattern = "Double Top (Reversal)";
                    }
                }
                
                // Аналогично для Double Bottom
                const maxBottom = Math.max(...bottoms);
                const minBottom = Math.min(...bottoms);
                let troughs = [];
                for (let i = 1; i < bottoms.length - 1; i++) {
                    if (bottoms[i] < bottoms[i-1] && bottoms[i] < bottoms[i+1]) troughs.push(i);
                }
                troughs = troughs.filter(i => bottoms[i] <= minBottom * 1.02);
                if (troughs.length >= 2) {
                    const first = troughs[0], second = troughs[troughs.length-1];
                    const between = bottoms.slice(first, second+1);
                    if (Math.max(...between) > minBottom * 1.05) {
                        detectedPattern = "Double Bottom (Reversal)";
                    }
                }
            }

            // --- 4. ОБЪЕМЫ (используем тот же imgData, анализируем только нижнюю часть) ---
            let volumeStatus = "Normal";
            const startY = Math.floor(h * 0.8);
            let coloredPixels = 0;
            const totalPixelsInBand = w * (h - startY);
            for (let y = startY; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const idx = (y * w + x) * 4;
                    if (imgData[idx+3] > 0 && (imgData[idx] > 50 || imgData[idx+1] > 50 || imgData[idx+2] > 50)) {
                        coloredPixels++;
                    }
                }
            }
            if (coloredPixels > totalPixelsInBand * 0.1) volumeStatus = "High (Climax)";

            // --- 5. ВОЛАТИЛЬНОСТЬ (PHASE) ---
            const avgSize = candles.reduce((a,b) => a + b.size, 0) / candles.length;
            const recentSize = lastN.reduce((a,b) => a + b.size, 0) / lastN.length;
            const marketPhase = recentSize > avgSize * 1.5 ? "Impulsive (High Vol)" : "Sideways (Accumulation)";

            // --- ИТОГОВЫЙ СИГНАЛ ---
            let isUp = lastCandle.isUp;
            let confidence = 70 + (nearLevel ? 15 : 0) + (volumeStatus === "High (Climax)" ? 10 : 0);
            if (nearLevel && !lastCandle.isUp && marketPhase.includes("Impulsive")) isUp = false;

            // Переключение на экран результата
            document.getElementById('screen-upload').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
            
            const resS = document.getElementById('resSignal');
            resS.innerText = isUp ? "CALL 🟢" : "PUT 🔴";
            resS.style.color = isUp ? "var(--accent)" : "var(--danger)";
            document.getElementById('resAccuracy').innerText = "Confidence: " + Math.min(confidence, 98.4).toFixed(1) + "%";
            
            document.getElementById('resPattern').innerText = detectedPattern;
            document.getElementById('resPhase').innerText = marketPhase;
            document.getElementById('resVolume').innerText = volumeStatus;
            document.getElementById('resLevel').innerText = nearLevel !== undefined ? "Zone Active" : "No Major Zones";

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }
    </script>
</body>
</html>
