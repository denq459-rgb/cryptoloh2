<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Trading Scanner Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      padding: 20px;
      margin: 0;
    }

    h1 {
      text-align: center;
      font-size: 22px;
    }

    .card {
      background: #111a2e;
      padding: 15px;
      border-radius: 14px;
      margin-top: 15px;
      position: relative;
      overflow: hidden;
      border: 1px solid #1e293b;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:active {
      transform: scale(0.98);
    }

    input {
      width: 100%;
      margin-top: 10px;
      color: white;
    }

    /* 🔥 SCANNER ANIMATION */
    .scanner-line {
      position: absolute;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #22c55e, transparent);
      top: 0;
      left: 0;
      animation: scan 2s linear infinite;
      display: none;
    }

    @keyframes scan {
      0% { top: 0%; opacity: 0.2; }
      50% { opacity: 1; }
      100% { top: 100%; opacity: 0.2; }
    }

    .signal {
      font-size: 34px;
      text-align: center;
      font-weight: bold;
      margin-top: 15px;
    }

    .pulse {
      animation: pulse-anim 1.5s infinite;
    }

    @keyframes pulse-anim {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .buy { color: #22c55e; }
    .sell { color: #ef4444; }
    .wait { color: #eab308; }

    .box {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.6;
      background: rgba(255,255,255,0.05);
      padding: 10px;
      border-radius: 8px;
    }

    .strategy {
      margin-top: 15px;
      padding: 10px;
      background: #0f172a;
      border-radius: 10px;
      font-size: 13px;
    }

    .tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      margin: 3px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .green { background: #14532d; color: #4ade80; }
    .red { background: #7f1d1d; color: #f87171; }

    .loading {
      text-align: center;
      margin-top: 10px;
      color: #60a5fa;
      display: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h1>📡 AI Market Scanner</h1>

<div class="card">
  <div class="scanner-line" id="scanner"></div>

  <input type="file" id="fileInput" accept="image/*" />
  <button onclick="analyze()">SCAN MARKET</button>

  <div class="loading" id="loading">Scanning market structure...</div>
</div>

<div class="card">
  <div class="signal pulse" id="signal">WAIT</div>

  <div class="box">
    <b>Score:</b> <span id="score">-</span><br>
    <b>Expiry:</b> <span id="expiry">-</span><br>
    <b>Accuracy:</b> <span id="accuracy">-</span>
  </div>

  <div class="strategy">
    <b>Multi-Strategy Engine:</b><br>
    <div id="strategies" style="margin-top: 8px;"></div>
  </div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  function getExpiry(score) {
    if (score >= 85) return "5 min";
    if (score >= 70) return "10 min";
    if (score >= 60) return "15 min";
    return "NO TRADE";
  }

  function showScanner() {
    document.getElementById("scanner").style.display = "block";
    document.getElementById("loading").style.display = "block";
  }

  function hideScanner() {
    document.getElementById("scanner").style.display = "none";
    document.getElementById("loading").style.display = "none";
  }

  async function analyze() {
    const fileInput = document.getElementById("fileInput");
    const file = fileInput.files[0];

    if (!file) {
      alert("Please upload a screenshot first!");
      return;
    }

    showScanner();

    const formData = new FormData();
    formData.append("file", file);

    try {
      // ПРИМЕЧАНИЕ: Если работаете через Telegram, используйте https:// и реальный домен
      const res = await fetch("http://localhost:8000/analyze/", {
        method: "POST",
        body: formData
      });

      if (!res.ok) throw new Error("Server error: " + res.status);

      const data = await res.json();

      hideScanner();

      // Отображение сигнала (BUY/SELL/WAIT)
      const signalEl = document.getElementById("signal");
      const signalValue = data.signal || "WAIT";
      signalEl.innerText = signalValue;
      
      // Сброс и установка цвета
      signalEl.className = "signal pulse"; 
      if (signalValue.toLowerCase().includes("buy")) signalEl.classList.add("buy");
      else if (signalValue.toLowerCase().includes("sell")) signalEl.classList.add("sell");
      else signalEl.classList.add("wait");

      // Данные
      const score = data.score || 0;
      document.getElementById("score").innerText = score;
      document.getElementById("expiry").innerText = getExpiry(score);
      document.getElementById("accuracy").innerText = (data.accuracy || 0) + "%";

      // Стратегии
      const strategiesEl = document.getElementById("strategies");
      strategiesEl.innerHTML = "";

      const strategies = data.strategies || {
        supertrend: false,
        ema200: false,
        rsi: false,
        macd: false,
        volume: false
      };

      for (let key in strategies) {
        const ok = strategies[key];
        const tag = document.createElement("div");
        tag.className = "tag " + (ok ? "green" : "red");
        tag.innerText = (ok ? "✔️ " : "✖️ ") + key.toUpperCase();
        strategiesEl.appendChild(tag);
      }

    } catch (err) {
      console.error(err);
      alert("Error: " + err.message);
      hideScanner();
    }
  }
</script>

</body>
</html>
