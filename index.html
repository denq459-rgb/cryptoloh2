<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Market Scanner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body { font-family: Arial, sans-serif; background: #0b1220; color: white; padding: 20px; }
    h1 { text-align: center; font-size: 20px; }
    .card { background: #111a2e; padding: 15px; border-radius: 14px; margin-top: 15px; position: relative; overflow: hidden; border: 1px solid #1e293b; }
    input { width: 100%; margin-top: 10px; color: white; }
    button { width: 100%; padding: 14px; border: none; border-radius: 10px; background: linear-gradient(90deg, #22c55e, #16a34a); color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    
    .scanner-line { position: absolute; width: 100%; height: 3px; background: linear-gradient(90deg, transparent, #22c55e, transparent); top: 0; left: 0; animation: scan 1.8s linear infinite; display: none; }
    @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

    img { width: 100%; margin-top: 10px; border-radius: 10px; display: none; border: 1px solid #334155; }
    .signal { font-size: 34px; text-align: center; font-weight: bold; margin-top: 15px; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
    .pulse { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    .buy { color: #22c55e; }
    .sell { color: #ef4444; }
    .wait { color: #eab308; }

    .box { margin-top: 10px; font-size: 14px; line-height: 1.5; }
    .tag { display: inline-block; padding: 4px 8px; border-radius: 6px; margin: 3px; font-size: 12px; font-weight: bold; }
    .green { background: #14532d; color: #4ade80; }
    .red { background: #7f1d1d; color: #f87171; }
    .loading { text-align: center; margin-top: 10px; color: #60a5fa; display: none; }
  </style>
</head>

<body>

<h1>📡 AI Market Scanner</h1>

<div class="card">
  <div class="scanner-line" id="scanner"></div>
  <input type="file" id="fileInput" accept="image/*" />
  <button onclick="analyze()">Scan Market</button>
  <img id="preview" />
  <div class="loading" id="loading">Scanning chart with AI...</div>
</div>

<div class="card">
  <div class="signal pulse" id="signal">WAIT</div>
  <div class="box">
    Score: <span id="score">-</span><br>
    Expiry: <span id="expiry">-</span><br>
    Accuracy: <span id="accuracy">-</span>%
  </div>
  <div class="box">
    <b>Strategies:</b>
    <div id="strategies" style="margin-top: 5px;"></div>
  </div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  let base64Image = null;

  // Конвертация в Base64 при выборе файла
  document.getElementById("fileInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
      base64Image = event.target.result;
      const img = document.getElementById("preview");
      img.src = base64Image;
      img.style.display = "block";
    };
    reader.readAsDataURL(file);
  });

  function setVisuals(on) {
    document.getElementById("scanner").style.display = on ? "block" : "none";
    document.getElementById("loading").style.display = on ? "block" : "none";
  }

  function getExpiry(score) {
    if (score >= 85) return "5 min";
    if (score >= 70) return "10 min";
    if (score >= 60) return "15 min";
    return "NO TRADE";
  }

  async function analyze() {
    if (!base64Image) {
      alert("Please upload a screenshot first!");
      return;
    }

    setVisuals(true);

    try {
      // ПРОВЕРЬТЕ ЭТОТ URL. Если с телефона - localhost не сработает!
      const res = await fetch("http://localhost:8000/analyze-base64/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: base64Image })
      });
    
      if (!res.ok) throw new Error("Server error: " + res.status);
      const data = await res.json();

      setVisuals(false);

      // 1. Сигнал и цвет
      const sigEl = document.getElementById("signal");
      const signalValue = data.signal || "WAIT";
      sigEl.innerText = signalValue;
      
      // Смена цвета текста
      sigEl.classList.remove("buy", "sell", "wait");
      if (signalValue.toLowerCase().includes("buy")) sigEl.classList.add("buy");
      else if (signalValue.toLowerCase().includes("sell")) sigEl.classList.add("sell");
      else sigEl.classList.add("wait");

      // 2. Данные (исправлен синтаксис ||)
      const score = data.score || 0;
      document.getElementById("score").innerText = score;
      document.getElementById("expiry").innerText = getExpiry(score);
      document.getElementById("accuracy").innerText = data.accuracy || 0;

      // 3. Стратегии
      const el = document.getElementById("strategies");
      el.innerHTML = "";
      const strategies = data.strategies || {};

      Object.keys(strategies).forEach(k => {
        const tag = document.createElement("div");
        tag.className = "tag " + (strategies[k] ? "green" : "red");
        tag.innerText = (strategies[k] ? "✔️ " : "✖️ ") + k.toUpperCase();
        el.appendChild(tag);
      });

    } catch (e) {
      console.error(e);
      setVisuals(false);
      alert("Error: " + e.message);
    }
  }
</script>

</body>
</html>
