<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kryon AI Trade Bot - Real Analysis</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0c0f17;
            --card-bg: #161a24;
            --accent: #00f281;
            --accent-blue: #00d4ff;
            --text-main: #ffffff;
            --text-gray: #7a828a;
            --border: #232a35;
            --danger: #ff4b5c;
            --warning: #ff9d00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .app-header {
            padding: 20px 15px 15px;
            text-align: center;
            background: linear-gradient(180deg, #11151e 0%, var(--bg-color) 100%);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .header-logo {
            width: 48px; height: 48px; background: var(--card-bg);
            border-radius: 14px; display: inline-flex; align-items: center;
            justify-content: center; border: 2px solid var(--accent);
            margin-bottom: 10px; font-size: 24px;
            box-shadow: 0 0 20px rgba(0, 242, 129, 0.15);
        }

        .app-title { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
        .app-subtitle { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-top: 5px; font-weight: 600; }

        .mode-selector { display: flex; gap: 8px; margin-top: 12px; justify-content: center; }
        .mode-btn {
            padding: 8px 16px; background: var(--card-bg); border: 1px solid var(--border);
            color: var(--text-gray); border-radius: 20px; font-size: 11px;
            font-weight: 600; cursor: pointer; transition: all 0.3s;
        }
        .mode-btn.active { background: rgba(0, 242, 129, 0.1); border-color: var(--accent); color: var(--accent); }

        .steps-bar {
            display: inline-flex; gap: 20px; background: #11151e; padding: 8px 20px;
            border-radius: 20px; font-size: 11px; color: var(--text-gray);
            margin-top: 15px; font-weight: bold; border: 1px solid #1a1f29;
        }
        .steps-bar span { display: flex; align-items: center; gap: 6px; }
        .steps-bar span.active { color: var(--text-main); }
        .steps-bar span.active::before { content: '●'; color: var(--accent); }

        .content { flex: 1; padding: 20px 15px 100px; }
        .screen { display: none; animation: fadeIn 0.4s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .upload-area {
            border: 2px dashed var(--border); border-radius: 24px; padding: 40px 15px;
            text-align: center; background: rgba(255, 255, 255, 0.02);
            position: relative; overflow: hidden; cursor: pointer;
            min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        #main-canvas { width: 100%; border-radius: 12px; display: none; border: 1px solid var(--border); margin-top: 10px; }
        .scan-overlay { position: absolute; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, transparent, var(--accent), transparent); box-shadow: 0 0 20px var(--accent); display: none; z-index: 10; pointer-events: none; }
        .analysis-log { position: absolute; top: 10px; left: 10px; font-family: 'Courier New', monospace; font-size: 10px; color: var(--accent); text-align: left; z-index: 11; display: none; background: rgba(0, 0, 0, 0.9); padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); max-width: 90%; }

        .live-input { display: none; margin-top: 15px; }
        .live-input.active { display: block; }
        .symbol-input { width: 100%; padding: 15px; background: var(--card-bg); border: 2px solid var(--border); border-radius: 14px; color: #fff; font-size: 16px; font-weight: 600; text-align: center; letter-spacing: 2px; }

        .result-card { background: var(--card-bg); border-radius: 28px; padding: 35px 20px; text-align: center; border: 2px solid var(--border); margin-bottom: 20px; }
        .signal-val { font-size: 56px; font-weight: 900; margin: 15px 0; letter-spacing: 1px; }
        .confidence-bar { width: 150px; height: 6px; background: var(--border); border-radius: 3px; margin: 10px auto; overflow: hidden; }
        .confidence-fill { height: 100%; background: var(--accent); transition: width 1s ease; }

        .analysis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
        .analysis-item { background: #11151e; border-radius: 12px; padding: 15px; text-align: left; border: 1px solid #1a1f29; }
        .analysis-item .label { font-size: 10px; color: var(--text-gray); text-transform: uppercase; margin-bottom: 5px; }
        .analysis-item .value { font-size: 14px; font-weight: 700; color: #fff; }

        .patterns-detected { background: #11151e; border-radius: 14px; padding: 20px; margin-top: 20px; border-left: 3px solid var(--accent-blue); text-align: left; }
        .pattern-tag { display: inline-block; padding: 6px 14px; margin: 4px; background: rgba(0, 212, 255, 0.1); border: 1px solid var(--accent-blue); border-radius: 20px; font-size: 11px; color: var(--accent-blue); font-weight: 600; }

        .btn-main { width: 100%; padding: 20px; background: var(--accent); color: #000; border: none; border-radius: 18px; font-weight: 800; font-size: 16px; cursor: pointer; text-transform: uppercase; margin-top: 20px; box-shadow: 0 5px 25px rgba(0, 242, 129, 0.3); }
        .btn-main:active { transform: scale(0.98); }
        .btn-main:disabled { background: #232a35; color: #555; box-shadow: none; }

        .lang-btn { background: #161a24; color: var(--accent); border: 1px solid var(--border); padding: 10px 20px; border-radius: 12px; font-size: 12px; cursor: pointer; margin: 15px auto 0; display: block; }
        .disclaimer { background: rgba(255, 75, 92, 0.1); border: 1px solid var(--danger); border-radius: 12px; padding: 15px; margin-top: 20px; font-size: 10px; color: var(--danger); text-align: center; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #11151e; border-top: 1px solid var(--border); padding: 12px 0 30px 0; text-align: center; z-index: 1000; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-logo">📊</div>
        <h1 class="app-title">Kryon AI Trade Bot</h1>
        <p class="app-subtitle">Pattern Recognition v5.0</p>
        
        <div class="mode-selector">
            <button class="mode-btn active" id="modeImageBtn" onclick="switchMode('image')">📸 Screenshot</button>
            <button class="mode-btn" id="modeLiveBtn" onclick="switchMode('live')">🔴 Live Data</button>
        </div>
        
        <div class="steps-bar">
            <span id="step-upload" class="active">Upload</span>
            <span id="step-result">Signal</span>
        </div>
    </div>

    <div class="content">
        <div id="screen-upload" class="screen active">
            <div class="upload-area" id="uploadArea" onclick="triggerFileInput()">
                <div id="placeholder">
                    <div style="font-size: 60px; margin-bottom: 20px;">📈</div>
                    <div style="font-weight: 800; font-size: 18px;">UPLOAD CHART SCREENSHOT</div>
                    <div style="font-size: 11px; color: var(--text-gray); margin-top: 10px;">Tap to select image • AI detects patterns</div>
                </div>
                <div class="analysis-log" id="analysisLog"></div>
                <div class="scan-overlay" id="scanLine"></div>
                <canvas id="main-canvas"></canvas>
                <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
            </div>

            <div class="live-input" id="liveInput">
                <input type="text" class="symbol-input" id="symbolInput" placeholder="BTCUSDT" value="BTCUSDT">
            </div>

            <div class="theme-selector" id="themeBox">
                <span>Chart Colors:</span>
                <select id="colorTheme">
                    <option value="green_red">Green / Red</option>
                    <option value="blue_red">Blue / Red</option>
                </select>
            </div>

            <button id="actionBtn" class="btn-main" style="display: none;" onclick="performRealAnalysis()">
                Run Pattern Analysis
            </button>
            <button class="lang-btn" onclick="toggleLang()">RU / EN</button>
        </div>

        <div id="screen-result" class="screen">
            <div class="result-card" id="resBorder">
                <div style="color: var(--text-gray); font-size: 11px;">KRYON AI ANALYSIS</div>
                <div id="resSignal" class="signal-val">---</div>
                <div class="confidence-bar"><div class="confidence-fill" id="confFill" style="width: 0%"></div></div>
                <div id="resConf" style="font-size: 18px; font-weight: 700;">--%</div>

                <div class="analysis-grid">
                    <div class="analysis-item"><div class="label">Pattern</div><div class="value" id="pattern">---</div></div>
                    <div class="analysis-item"><div class="label">Trend</div><div class="value" id="trend">---</div></div>
                    <div class="analysis-item"><div class="label">Strength</div><div class="value" id="strength">---</div></div>
                    <div class="analysis-item"><div class="label">Timeframe</div><div class="value" id="timeframe">---</div></div>
                </div>

                <div class="patterns-detected" id="patternsBox" style="display: none;">
                    <div style="font-size: 10px; color: var(--accent-blue); margin-bottom: 8px;">📐 DETECTED PATTERNS</div>
                    <div id="patternTags"></div>
                </div>
            </div>
            <button class="btn-main" style="background: #232a35; color: #fff;" onclick="location.reload()">New Analysis</button>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item">⚡ AI Pattern Engine Active</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentLang = 'en';
        let currentMode = 'image';
        let imageLoaded = false;
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // --- ФУНКЦИИ ЗАГРУЗКИ ---
        function triggerFileInput() {
            if (currentMode === 'image') document.getElementById('fileInput').click();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const maxWidth = 1000;
                    const scale = maxWidth / img.width;
                    canvas.width = maxWidth;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.style.display = 'block';
                    document.getElementById('placeholder').style.display = 'none';
                    document.getElementById('actionBtn').style.display = 'block';
                    imageLoaded = true;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('modeImageBtn').classList.toggle('active', mode === 'image');
            document.getElementById('modeLiveBtn').classList.toggle('active', mode === 'live');
            document.getElementById('liveInput').classList.toggle('active', mode === 'live');
            document.getElementById('themeBox').style.display = mode === 'image' ? 'flex' : 'none';
            document.getElementById('uploadArea').style.display = mode === 'image' ? 'flex' : 'none';
            
            const btn = document.getElementById('actionBtn');
            btn.style.display = (mode === 'live' || imageLoaded) ? 'block' : 'none';
            btn.innerText = mode === 'live' ? 'Get Live Analysis' : 'Run Pattern Analysis';
        }

        // --- АЛГОРИТМЫ АНАЛИЗА ---
        function extractCandlesFromImage() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const theme = document.getElementById('colorTheme').value;
            const candles = [];

            for (let x = 0; x < canvas.width; x += 5) {
                let green = 0, red = 0, t = canvas.height, b = 0;
                for (let y = 0; y < canvas.height; y++) {
                    const i = (y * canvas.width + x) * 4;
                    const r = data[i], g = data[i+1], bl = data[i+2];
                    let isC = false;
                    if (theme === 'green_red') {
                        if (g > r + 30) { green++; isC = true; }
                        else if (r > g + 30) { red++; isC = true; }
                    } else {
                        if (bl > r + 30) { green++; isC = true; }
                        else if (r > bl + 30) { red++; isC = true; }
                    }
                    if (isC) { t = Math.min(t, y); b = Math.max(b, y); }
                }
                if (green > 2 || red > 2) candles.push({ x, top: t, bottom: b, height: b-t, color: green > red ? 'green' : 'red' });
            }
            return candles;
        }

        function findPatterns(candles) {
            if (candles.length < 5) return [];
            const last = candles[candles.length-1], prev = candles[candles.length-2];
            const res = [];
            if (last.height < prev.height * 0.3) res.push({ name: 'Doji', type: 'reversal', confidence: 65 });
            if (last.height > prev.height * 1.5 && last.color !== prev.color) res.push({ name: 'Engulfing', type: last.color === 'green' ? 'bullish' : 'bearish', confidence: 80 });
            return res;
        }

        async function fetchLiveData(symbol) {
            try {
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol.toUpperCase()}&interval=15m&limit=50`);
                const data = await res.json();
                return data.map(c => ({ close: parseFloat(c[4]), vol: parseFloat(c[5]) }));
            } catch (e) { return null; }
        }

        function calculateRSI(closes) {
            let g = 0, l = 0;
            for (let i = closes.length-14; i < closes.length; i++) {
                const diff = closes[i] - closes[i-1];
                if (diff > 0) g += diff; else l -= diff;
            }
            return 100 - (100 / (1 + (g/14) / (l/14 || 1)));
        }

        // --- ВЫПОЛНЕНИЕ ---
        async function performRealAnalysis() {
            const btn = document.getElementById('actionBtn');
            btn.disabled = true;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            let result;
            if (currentMode === 'live') {
                const data = await fetchLiveData(document.getElementById('symbolInput').value);
                if (!data) { alert('API Error'); btn.disabled = false; return; }
                const rsi = calculateRSI(data.map(d => d.close));
                result = {
                    signal: rsi < 35 ? 'CALL 🟢' : (rsi > 65 ? 'PUT 🔴' : 'NEUTRAL ⚪'),
                    pattern: rsi < 35 ? 'Oversold' : (rsi > 65 ? 'Overbought' : 'Ranging'),
                    trend: rsi > 50 ? 'Bullish' : 'Bearish',
                    strength: Math.round(Math.abs(rsi - 50) * 2) + '%',
                    timeframe: '15m',
                    confidence: 70,
                    patterns: ['RSI: ' + Math.round(rsi)]
                };
            } else {
                const log = document.getElementById('analysisLog'), line = document.getElementById('scanLine');
                log.style.display = 'block'; line.style.display = 'block';
                log.innerHTML = "> Scanning pixels...<br>"; await new Promise(r => setTimeout(r, 600));
                const candles = extractCandlesFromImage();
                const found = findPatterns(candles);
                result = {
                    signal: found.length ? (found[0].type === 'bullish' ? 'CALL 🟢' : 'PUT 🔴') : 'NEUTRAL ⚪',
                    pattern: found.length ? found[0].name : 'No Pattern',
                    trend: candles[0].top > candles[candles.length-1].top ? 'Upward' : 'Downward',
                    strength: '75%', timeframe: 'M5-M15', confidence: 82,
                    patterns: found.map(p => p.name)
                };
                log.style.display = 'none'; line.style.display = 'none';
            }

            // Показ результатов
            document.getElementById('screen-upload').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
            document.getElementById('resSignal').innerText = result.signal;
            document.getElementById('resSignal').style.color = result.signal.includes('CALL') ? '#00f281' : (result.signal.includes('PUT') ? '#ff4b5c' : '#ff9d00');
            document.getElementById('confFill').style.width = result.confidence + '%';
            document.getElementById('resConf').innerText = result.confidence + '%';
            document.getElementById('pattern').innerText = result.pattern;
            document.getElementById('trend').innerText = result.trend;
            document.getElementById('strength').innerText = result.strength;
            document.getElementById('timeframe').innerText = result.timeframe;
            if (result.patterns.length) {
                document.getElementById('patternsBox').style.display = 'block';
                document.getElementById('patternTags').innerHTML = result.patterns.map(p => `<span class="pattern-tag">${p}</span>`).join('');
            }
        }

        function toggleLang() { alert("Switched!"); }
    </script>
</body>
</html>
