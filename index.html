<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kryon AI Trade Bot - Ultra Vision V5</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0c0f17;
            --card-bg: #161a24;
            --accent: #00f281;
            --text-main: #ffffff;
            --text-gray: #7a828a;
            --border: #232a35;
            --danger: #ff4b5c;
            --warning: #ff9d00;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0; padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            padding: 20px 15px;
            text-align: center;
            background: linear-gradient(to bottom, #11151e, var(--bg-color));
            border-bottom: 1px solid var(--border);
        }
        .header-logo {
            width: 42px; height: 42px;
            background: var(--card-bg);
            border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            border: 1px solid var(--accent);
            margin-bottom: 8px; font-size: 24px;
            box-shadow: 0 0 15px rgba(0, 242, 129, 0.2);
        }
        .app-title { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: 0.5px; }
        
        .content { 
            flex: 1; 
            padding: 15px;
            overflow-y: auto;
            padding-bottom: 100px;
        }
        
        .screen { display: none; animation: fadeIn 0.4s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 24px;
            padding: 40px 15px;
            text-align: center;
            background: rgba(255,255,255,0.02);
            position: relative;
            cursor: pointer;
        }

        #main-canvas { width: 100%; border-radius: 12px; display: none; margin-top: 10px; border: 1px solid var(--border); }
        .scan-line { position: absolute; left: 0; width: 100%; height: 2px; background: var(--accent); box-shadow: 0 0 15px var(--accent); display: none; z-index: 10; }

        .result-card { 
            background: var(--card-bg); border-radius: 28px; padding: 30px 20px; text-align: center; border: 2px solid var(--border);
        }
        .signal-val { font-size: 48px; font-weight: 900; margin: 10px 0; }
        
        .analysis-box {
            background: #11151e; border-radius: 16px; padding: 15px; margin-top: 20px; text-align: left;
        }
        .analysis-item { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 10px; color: var(--text-gray); border-bottom: 1px solid #1a1f29; padding-bottom: 5px; }
        .analysis-item b { color: #fff; }

        .btn-main {
            width: 100%; padding: 20px; background: var(--accent); color: #000; border: none; border-radius: 18px; font-weight: 800; font-size: 16px; cursor: pointer; text-transform: uppercase; margin-top: 20px;
        }
        .btn-main:disabled { background: #232a35; color: #555; }

        .nav-bar {
            position: fixed; bottom: 0; width: 100%; background: #11151e; border-top: 1px solid var(--border); padding: 15px 0 30px 0; text-align: center;
        }
        .nav-item { color: var(--accent); font-size: 10px; font-weight: bold; text-transform: uppercase; }

        /* Стили лога */
        #analysisLog {
            font-family: monospace; font-size: 10px; color: var(--accent); margin-top: 10px; text-align: left; display: none;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-logo">🤖</div>
        <h1 class="app-title">Kryon AI Vision V5</h1>
        <div style="font-size: 10px; color: var(--accent); margin-top: 5px;">ADVANCED NEURAL ENGINE ACTIVE</div>
    </div>

    <div class="content">
        <div id="screen-upload" class="screen active">
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div id="placeholder">
                    <div style="font-size: 40px; margin-bottom: 15px;">📸</div>
                    <b data-i18n="up_t">ЗАГРУЗИТЬ ГРАФИК</b>
                    <p style="font-size: 11px; color: var(--text-gray);" data-i18n="up_d">ИИ проанализирует объемы и свечные паттерны</p>
                </div>
                <div class="scan-line" id="scanLine"></div>
                <canvas id="main-canvas"></canvas>
            </div>
            
            <div id="analysisLog"></div>

            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(this)">
            <button id="visionBtn" class="btn-main" style="display:none" onclick="performDeepAnalysis()" data-i18n="btn_scan">АНАЛИЗ</button>
            <button class="btn-main" style="background: transparent; color: var(--text-gray); border: 1px solid var(--border); margin-top: 10px;" onclick="toggleLang()">RU / EN</button>
        </div>

        <div id="screen-result" class="screen">
            <div class="result-card" id="resBorder">
                <div style="color: var(--text-gray); font-size: 10px;" data-i18n="res_l">NEURAL ANALYSIS RESULT</div>
                <div id="resSignal" class="signal-val">---</div>
                <div id="resAccuracy" style="font-size: 18px; font-weight: bold; color: var(--accent);">Confidence: --%</div>
                
                <div class="analysis-box">
                    <div class="analysis-item"><span data-i18n="an_v">Volumes:</span> <b id="val-vol">---</b></div>
                    <div class="analysis-item"><span data-i18n="an_p">Pattern:</span> <b id="val-patt">---</b></div>
                    <div class="analysis-item"><span data-i18n="an_t">Time:</span> <b id="val-time">---</b></div>
                </div>
            </div>
            <button class="btn-main" style="background: #232a35; color: #fff;" onclick="location.reload()" data-i18n="btn_new">NEW SCAN</button>
        </div>
    </div>

    <div class="nav-bar"><div class="nav-item">⚡ High Accuracy Mode</div></div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg.expand) tg.expand();

        let currentLang = 'ru';
        let detectedTheme = 'green_red';
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const trans = {
            ru: {
                up_t: "ЗАГРУЗИТЬ СКРИНШОТ", up_d: "ИИ анализирует объемы и хвосты свечей",
                btn_scan: "ЗАПУСТИТЬ ИИ-СКАН", res_l: "РЕЗУЛЬТАТ НЕЙРОННОГО АНАЛИЗА",
                an_v: "Объемы:", an_p: "Паттерн:", an_t: "Время:",
                btn_new: "НОВЫЙ СКАН", up: "ВВЕРХ 🟢", down: "ВНИЗ 🔴",
                vol_high: "ВЫСОКИЕ (Подтверждено)", vol_low: "НИЗКИЕ (Дивергенция)",
                p_pin: "Pin-Bar (Разворот)", p_trend: "Trend Flow (По тренду)", p_neut: "Neutral (Боковик)",
                log_1: "> Фильтрация шума и сетки...", log_2: "> Анализ зоны объемов...", log_3: "> Детекция хвостов свечей...", log_4: "> Проверка паттернов...", log_5: "> Финализация данных..."
            },
            en: {
                up_t: "UPLOAD SCREENSHOT", up_d: "AI analyzes volumes and candle wicks",
                btn_scan: "RUN AI SCAN", res_l: "NEURAL ANALYSIS RESULT",
                an_v: "Volumes:", an_p: "Pattern:", an_t: "Exp. Time:",
                btn_new: "NEW SCAN", up: "CALL 🟢", down: "PUT 🔴",
                vol_high: "HIGH (Confirmed)", vol_low: "LOW (Divergence)",
                p_pin: "Pin-Bar (Reversal)", p_trend: "Trend Flow", p_neut: "Neutral (Sideways)",
                log_1: "> Grid & Noise filtering...", log_2: "> Volume zone scanning...", log_3: "> Candle wick detection...", log_4: "> Pattern matching...", log_5: "> Finalizing score..."
            }
        };

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'ru' : 'en';
            updateLocalization();
        }

        function updateLocalization() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (trans[currentLang][key]) el.innerText = trans[currentLang][key];
            });
        }
        updateLocalization();

        window.handleImage = function(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const aspect = img.height / img.width;
                    canvas.width = 1000; 
                    canvas.height = 1000 * aspect;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.style.display = 'block';
                    document.getElementById('placeholder').style.display = 'none';
                    document.getElementById('visionBtn').style.display = 'block';
                    autoDetectTheme();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        // ПУНКТ 1: АВТООПРЕДЕЛЕНИЕ И ФИЛЬТРАЦИЯ ШУМА
        function autoDetectTheme() {
            const data = ctx.getImageData(0, 0, canvas.width, 100).data;
            let green = 0, blue = 0;
            for(let i=0; i<data.length; i+=40) {
                if (data[i+1] > data[i] + 30) green++;
                if (data[i+2] > data[i] + 30) blue++;
            }
            detectedTheme = (blue > green) ? 'blue_red' : 'green_red';
            console.log("Detected Theme:", detectedTheme);
        }

        window.performDeepAnalysis = async function() {
            const btn = document.getElementById('visionBtn');
            const log = document.getElementById('analysisLog');
            const line = document.getElementById('scanLine');
            const t = trans[currentLang];

            btn.disabled = true;
            log.style.display = 'block';
            line.style.display = 'block';

            for(let i=1; i<=5; i++) {
                log.innerHTML += t['log_'+i] + "<br>";
                line.style.top = (i * 18) + "%";
                if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                await new Promise(r => setTimeout(r, 700));
            }

            const w = canvas.width, h = canvas.height;
            const chartMid = Math.floor(h * 0.2);
            const chartHeight = Math.floor(h * 0.6);

            // ПУНКТ 2: АНАЛИЗ ОБЪЕМОВ (Нижняя зона)
            const volZoneTop = Math.floor(h * 0.82);
            const volData = ctx.getImageData(0, volZoneTop, w, h * 0.1).data;
            let volIntensity = 0;
            for(let i=0; i<volData.length; i+=16) {
                // Фильтр шума: только насыщенные цвета, игнорируем серый
                const r=volData[i], g=volData[i+1], b=volData[i+2];
                if (Math.max(r,g,b) - Math.min(r,g,b) > 50) volIntensity++;
            }

            // ПУНКТ 3: АНАЛИЗ ПАТТЕРНОВ (Хвосты и Свечи)
            const mX = Math.floor(w * 0.80), mW = Math.floor(w * 0.1);
            const mData = ctx.getImageData(mX, chartMid, mW, chartHeight).data;
            
            let pixelsUp = 0, pixelsDown = 0;
            let topMass = 0, bottomMass = 0; // Для поиска Pin-bar

            for(let i=0; i<mData.length; i+=32) {
                const r=mData[i], g=mData[i+1], b=mData[i+2];
                const y = (i/4) / mW;
                
                // Фильтрация сетки (игнорируем, если разница между RGB мала)
                if (Math.max(r,g,b) - Math.min(r,g,b) < 40) continue;

                const isUp = (detectedTheme === 'green_red') ? (g > r+20) : (b > r+20);
                const isDown = (r > g+20);

                if(isUp) { 
                    pixelsUp++; 
                    if(y < chartHeight * 0.4) topMass++; else bottomMass++;
                }
                if(isDown) { 
                    pixelsDown++; 
                    if(y < chartHeight * 0.4) topMass++; else bottomMass++;
                }
            }

            // Глобальный тренд
            const backData = ctx.getImageData(0, chartMid, w*0.7, chartHeight).data;
            let gUp=0, gDown=0;
            for(let i=0; i<backData.length; i+=256) {
                if (Math.max(backData[i],backData[i+1],backData[i+2]) - Math.min(backData[i],backData[i+1],backData[i+2]) < 40) continue;
                if(detectedTheme === 'green_red' ? backData[i+1] > backData[i]+20 : backData[i+2] > backData[i]+20) gUp++; else gDown++;
            }

            // Итоговая логика
            let finalUp = pixelsUp > pixelsDown;
            let pattern = t.p_trend;
            let accuracy = 72;
            let volumeStatus = volIntensity > (w * h * 0.005) ? t.vol_high : t.vol_low;

            // Детекция Pin-bar (если основная масса пикселей в одной половине свечи)
            if (Math.abs(topMass - bottomMass) > (topMass + bottomMass) * 0.5) {
                pattern = t.p_pin;
                accuracy += 12;
                finalUp = (bottomMass > topMass); // Если хвост снизу — идем вверх
            }

            // Дивергенция объемов
            if (volumeStatus === t.vol_low) accuracy -= 10;

            // Вывод результата
            document.getElementById('screen-upload').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
            
            const sig = document.getElementById('resSignal');
            sig.innerText = finalUp ? t.up : t.down;
            sig.style.color = finalUp ? "var(--accent)" : "var(--danger)";
            document.getElementById('resBorder').style.borderColor = sig.style.color;

            document.getElementById('val-vol').innerText = volumeStatus;
            document.getElementById('val-patt').innerText = pattern;
            document.getElementById('val-time').innerText = (pattern === t.p_pin) ? "1-2 MIN" : "3-5 MIN";
            document.getElementById('resAccuracy').innerText = "Confidence: " + (accuracy + Math.random()*5).toFixed(1) + "%";

            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        };
    </script>
</body>
</html>
