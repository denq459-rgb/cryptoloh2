<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Market Scanner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #0b1220;
      color: white;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: #111a2e;
      padding: 15px;
      border-radius: 14px;
      margin-top: 15px;
      position: relative;
      overflow: hidden;
    }

    input {
      width: 100%;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      color: white;
      font-size: 16px;
    }

    /* 🔥 SCANNER */
    .scanner-line {
      position: absolute;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #22c55e, transparent);
      top: 0;
      left: 0;
      animation: scan 1.8s linear infinite;
      display: none;
    }

    @keyframes scan {
      0% { top: 0%; opacity: 0.2; }
      50% { opacity: 1; }
      100% { top: 100%; opacity: 0.2; }
    }

    img {
      width: 100%;
      margin-top: 10px;
      border-radius: 10px;
      display: none;
    }

    .signal {
      font-size: 34px;
      text-align: center;
      font-weight: bold;
      margin-top: 15px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .buy { color: #22c55e; }
    .sell { color: #ef4444; }
    .wait { color: #eab308; }

    .box {
      margin-top: 10px;
      font-size: 14px;
    }

    .tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      margin: 3px;
      font-size: 12px;
      background: #1e293b;
    }

    .green { background: #14532d; }
    .red { background: #7f1d1d; }

    .loading {
      text-align: center;
      margin-top: 10px;
      color: #60a5fa;
      display: none;
    }
  </style>
</head>

<body>

<h1>📡 AI Market Scanner</h1>

<div class="card">
  <div class="scanner-line" id="scanner"></div>

  <input type="file" id="fileInput" accept="image/*" />
  <button onclick="analyze()">Scan Market</button>

  <img id="preview" />
  <div class="loading" id="loading">Scanning chart with AI...</div>
</div>

<div class="card">

  <div class="signal" id="signal">WAIT</div>

  <div class="box">
    Score: <span id="score">-</span><br>
    Expiry: <span id="expiry">-</span><br>
    Accuracy: <span id="accuracy">-</span>%
  </div>

  <div class="box">
    <b>Strategies:</b>
    <div id="strategies"></div>
  </div>

</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  let base64Image = null;

  // 📸 convert to base64 (IMPORTANT for mobile screenshots)
  document.getElementById("fileInput").addEventListener("change", function(e) {
    const file = e.target.files[0];

    const reader = new FileReader();
    reader.onload = function(event) {
      base64Image = event.target.result;

      const img = document.getElementById("preview");
      img.src = base64Image;
      img.style.display = "block";
    };

    reader.readAsDataURL(file);
  });

  function scanOn() {
    document.getElementById("scanner").style.display = "block";
  }

  function scanOff() {
    document.getElementById("scanner").style.display = "none";
  }

  function getExpiry(score) {
    if (score >= 85) return "5 min";
    if (score >= 70) return "10 min";
    if (score >= 60) return "15 min";
    return "NO TRADE";
  }

  async function analyze() {

    if (!base64Image) {
      alert("Upload screenshot");
      return;
    }

    scanOn();
    document.getElementById("loading").style.display = "block";

    try {

      const res = await fetch("http://localhost:8000/analyze-base64/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          image: base64Image
        })
      });
    
    const data = await res.json();

      scanOff();
      document.getElementById("loading").style.display = "none";

      // signal
      document.getElementById("signal").innerText = data.signal;

      // score
      document.getElementById("score").innerText = data.score;

      // expiry
      document.getElementById("expiry").innerText =
        getExpiry(data.score);

      // accuracy
      document.getElementById("accuracy").innerText =
        data.accuracy  0;

      // strategies
      const el = document.getElementById("strategies");
      el.innerHTML = "";

      const strategies = data.strategies  {};

      Object.keys(strategies).forEach(k => {
        const tag = document.createElement("div");
        tag.className = "tag " + (strategies[k] ? "green" : "red");
        tag.innerText = (strategies[k] ? "✔️ " : "✖️ ") + k;
        el.appendChild(tag);
      });

    } catch (e) {
      console.error(e);
      scanOff();
      document.getElementById("loading").style.display = "none";
      alert("Backend error");
    }
  }
</script>

</body>
</html>
